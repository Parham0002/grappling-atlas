function home(){return '<section class="hero"><div class="eyebrow">The connected grappling encyclopedia</div><h1>Understand every position.<br>Build your own game.</h1><p>Explore throws, guards, submissions, sweeps, passes, escapes and their relationships across Brazilian Jiu-Jitsu and Judo.</p><button class="btn" data-go="atlas">Explore Encyclopedia →</button> <button class="btn alt" data-go="map">Open Grappling Map</button></section><div class="grid"><div class="card click" data-go="atlas"><div class="eyebrow">01 / Standing</div><h2>Throws & takedowns</h2><p>Judo nage-waza, wrestling entries and BJJ standing systems.</p></div><div class="card click" data-go="closed"><div class="eyebrow">02 / Ground</div><h2>Guard systems</h2><p>Closed Guard, Half Guard, Butterfly, passing and retention.</p></div><div class="card click" data-go="mygame"><div class="eyebrow">03 / Personal</div><h2>My Game</h2><p>Bookmark techniques, track learning and build a practice focus.</p></div></div><h2 style="margin-top:28px">Featured techniques</h2><div class="grid">'+[0,2,14,31,41,44].map(i=>'<div class="card click" data-open="'+i+'">'+tag(data[i].type)+'<h3>'+safe(data[i].name)+'</h3><p>'+safe(data[i].desc)+'</p><span class="muted">Explore →</span></div>').join('')+'</div>'}

};
function map(){let f=flows[selected]||flows['Closed Guard'];return '<div class="eyebrow">Interactive technique relationships</div><h1>Grappling Map</h1><p>Explore illustrative options from a selected position or technique. Actual transitions depend on opponent reactions and context.</p><div class="toolbar"><select id="graph-select">'+Object.keys(flows).map(n=>'<option '+(selected===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="graph"><div class="node"><strong>'+safe(flows[selected]?selected:'Closed Guard')+'</strong><div class="sub">Starting state</div></div><div class="arrow">↓</div><div class="branches">'+f[0].map(n=>'<div class="node" data-name="'+safe(n)+'"><strong>'+safe(n)+'</strong><div class="sub">Potential action →</div></div>').join('')+'</div><div class="arrow">↓</div><div class="node">Opponent reaction / positional change</div><div class="arrow">↓</div><div class="branches">'+f[1].map(n=>'<div class="node" data-name="'+safe(n)+'">'+safe(n)+'</div>').join('')+'</div></div><p style="margin-top:15px">Graph entries are examples for product demonstration, not a verified instructional sequence.</p>'}
function mygame(){return '<div class="eyebrow">Personal practice</div><h1>My Game</h1><p>Your favorites and learning status are stored locally in this browser.</p><div class="grid two"><div class="card"><div class="eyebrow">Saved techniques</div><h1>'+favorites.length+'</h1></div><div class="card"><div class="eyebrow">Tracking progress</div><h1>'+Object.keys(progress).filter(k=>progress[k]).length+'</h1></div></div><h2 style="margin-top:25px">Favorites</h2><div class="list">'+(favorites.length?favorites.map(id=>data[id]).filter(Boolean).map(item).join(''):'<div class="card"><p>No favorites yet. Save a technique from the encyclopedia.</p><button class="btn" data-go="atlas">Browse techniques</button></div>')+'</div><h2 style="margin-top:25px">Learning status</h2><div class="list">'+(Object.keys(progress).filter(k=>progress[k]).length?Object.entries(progress).filter(e=>e[1]).map(e=>'<div class="list-item"><strong>'+safe(e[0])+'</strong>'+tag(e[1])+'</div>').join(''):'<div class="card"><p>No tracked techniques yet.</p></div>')+'</div><p style="margin-top:20px"><button class="btn alt" id="export">Export personal data (JSON)</button></p>'}
function journalPage(){return '<div class="eyebrow">Training history</div><h1>Training Journal</h1><p>Log sessions and what you practiced. Saved locally in your browser.</p><div class="card"><h2>New training session</h2><div class="toolbar"><input class="input" type="date" id="session-date" value="'+new Date().toISOString().slice(0,10)+'"><select id="session-type"><option>BJJ</option><option>Judo</option><option>Open Mat</option><option>Competition</option></select></div><textarea id="session-notes" placeholder="Techniques practiced, sparring observations, questions..."></textarea><p><button class="btn" id="add-session">Save session</button></p></div><h2 style="margin-top:25px">Previous sessions</h2><div class="list">'+(journal.length?journal.slice().reverse().map(j=>'<div class="card"><div class="row"><strong>'+safe(j.date)+' · '+safe(j.type)+'</strong><span class="tag">Session</span></div><p style="white-space:pre-wrap">'+safe(j.notes)+'</p></div>').join(''):'<div class="card"><p>No sessions recorded yet.</p></div>')+'</div>'}
function render(){app.innerHTML=(page==='home'?home():page==='atlas'?atlas():page==='closed'?closed():page==='detail'?detail():page==='map'?map():page==='mygame'?mygame():journalPage())+'<div class="footer">Grappling Atlas · Functional offline preview · Sample taxonomy and content · Not a substitute for qualified coaching.</div>'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-open],[data-name],[data-fav],[data-perspective],#save-note,#add-session,#export');if(!b)return;if(b.dataset.go){nav(b.dataset.go);return}if(b.dataset.open!==undefined){selected=data[Number(b.dataset.open)].name;nav(selected==='Closed Guard'?'closed':'detail');return}if(b.dataset.name){selected=b.dataset.name;nav(selected==='Closed Guard'?'closed':'detail');return}if(b.dataset.fav!==undefined){let id=Number(b.dataset.fav);favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('favorites',favorites);render();return}if(b.dataset.perspective){perspective=b.dataset.perspective;render();return}if(b.id==='save-note'){notes[selected]=$('#note').value;save('notes',notes);b.textContent='Saved ✓';return}if(b.id==='add-session'){let notesText=$('#session-notes').value.trim();if(!notesText){alert('Please enter your training notes.');return}journal.push({date:$('#session-date').value,type:$('#session-type').value,notes:notesText});save('journal',journal);render();return}if(b.id==='export'){let blob=new Blob([JSON.stringify({favorites,progress,notes,journal},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='grappling-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let el=$('#search');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='progress'){progress[selected]=e.target.value;save('progress',progress)}if(e.target.id==='graph-select'){selected=e.target.value;render()}});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
render();
})();
</script></body></html>
